<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Viewport Measure</title>
  <!-- tesla-viewport-measure v2: hide-toolbar line-mode axis-lock -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 773px;
      height: 601px;
      overflow: hidden;
      background: #000;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 0;
      color: #eee;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    * { box-sizing: border-box; }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 601px;
      background: #111111;
      overflow: hidden;
      touch-action: none;
    }
    #grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 601px;
      pointer-events: none;
      z-index: 1;
    }
    #video {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      display: none;
      background: rgba(56, 140, 255, 0.16);
      border: 1px solid rgba(120, 180, 255, 0.55);
    }
    #video-label {
      position: absolute;
      height: 20px;
      line-height: 20px;
      text-align: center;
      font-size: 14px;
      color: rgba(200, 220, 255, 0.95);
      pointer-events: none;
      z-index: 2;
      display: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    #guide60 {
      position: absolute;
      left: 0;
      top: 361px;
      width: 773px;
      height: 0;
      border-top: 1px dashed rgba(255, 190, 70, 0.85);
      pointer-events: none;
      z-index: 3;
    }
    #guide60-label {
      position: absolute;
      right: 8px;
      top: 345px;
      height: 16px;
      line-height: 16px;
      font-size: 11px;
      color: rgba(255, 200, 90, 0.95);
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    #boxes, #lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 601px;
      z-index: 4;
      pointer-events: none;
    }
    #lines { z-index: 5; }
    .box {
      position: absolute;
      pointer-events: auto;
      overflow: visible;
      border: 2px solid;
    }
    .box-xy {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 11px;
      line-height: 14px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
    }
    .box-size {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 20px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      white-space: nowrap;
    }
    .box.selected {
      z-index: 5;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    .box-handle {
      display: none;
      position: absolute;
      right: 0;
      bottom: 0;
      width: 28px;
      height: 28px;
      cursor: nwse-resize;
      z-index: 3;
    }
    .box-handle::after {
      content: "";
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border: 2px solid #111;
      border-radius: 2px;
    }
    .box.selected .box-handle { display: block; }
    .box-delete, .line-delete {
      display: none;
      position: absolute;
      top: -10px;
      right: -10px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 16px;
      background: #d13b2e;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0;
      line-height: 32px;
      text-align: center;
      padding: 0;
      cursor: pointer;
      z-index: 4;
      pointer-events: auto;
    }
    .box.selected .box-delete { display: block; }
    .box.delete-inside .box-delete { top: 4px; right: 4px; }
    .box.delete-flip .box-delete { right: auto; left: -10px; }
    .box.delete-inside.delete-flip .box-delete { left: 4px; right: auto; }
    #lines-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 601px;
      pointer-events: none;
    }
    .line-label {
      position: absolute;
      height: 24px;
      line-height: 24px;
      padding: 0 8px;
      border-radius: 12px;
      background: rgba(12, 12, 12, 0.82);
      color: #fff;
      font-size: 15px;
      letter-spacing: 0;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }
    .line-ep {
      display: none;
      position: absolute;
      width: 28px;
      height: 28px;
      cursor: move;
      z-index: 3;
      pointer-events: auto;
    }
    .line-ep::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 6px;
      width: 16px;
      height: 16px;
      background: #fff;
      border: 2px solid #111;
      border-radius: 10px;
    }
    .line-ep.visible { display: block; }
    .line-delete.visible { display: block; }
    #bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 48px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    #readout {
      position: absolute;
      left: 6px;
      top: 2px;
      width: 381px;
      height: 44px;
      line-height: 44px;
      font-size: 12px;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
    }
    #readout .num { color: #fff; }
    #readout.mismatch .num { color: #ffb020; }
    #btn-undo, #btn-clear, #btn-snap, #btn-video, #btn-mode, #btn-export, #btn-hide {
      position: absolute;
      top: 2px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: #2c2c2c;
      color: #f0f0f0;
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #btn-undo:active, #btn-clear:active, #btn-snap:active,
    #btn-video:active, #btn-mode:active, #btn-export:active, #btn-hide:active {
      background: #3a3a3a;
    }
    #btn-undo { left: 393px; width: 48px; }
    #btn-clear { left: 445px; width: 52px; }
    #btn-snap { left: 501px; width: 48px; }
    #btn-video { left: 553px; width: 52px; }
    #btn-mode { left: 609px; width: 48px; }
    #btn-export { left: 661px; width: 54px; }
    #btn-hide { left: 719px; width: 48px; }
    #btn-snap.on, #btn-video.on, #btn-mode.on {
      background: #3e6ae1;
      color: #fff;
    }
    #restore {
      display: none;
      position: absolute;
      top: 6px;
      left: 727px;
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: rgba(36, 36, 36, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 773px;
      height: 601px;
      background: rgba(0, 0, 0, 0.62);
      z-index: 20;
    }
    #panel {
      position: absolute;
      left: 136px;
      top: 136px;
      width: 500px;
      height: 328px;
      background: #1c1c1c;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
    }
    #panel-title {
      position: absolute;
      left: 16px;
      top: 12px;
      height: 24px;
      line-height: 24px;
      font-size: 16px;
      color: #fff;
    }
    #panel-status {
      position: absolute;
      left: 16px;
      top: 38px;
      height: 18px;
      line-height: 18px;
      font-size: 12px;
      color: #9ad07a;
    }
    #panel-status.fail { color: #ffb020; }
    #export-text {
      position: absolute;
      left: 16px;
      top: 62px;
      width: 468px;
      height: 200px;
      margin: 0;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #121212;
      color: #e8e8e8;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 18px;
      resize: none;
      -webkit-user-select: text;
      user-select: text;
    }
    #btn-close {
      position: absolute;
      left: 16px;
      top: 272px;
      width: 120px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: #3e6ae1;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="grid" width="773" height="601"></canvas>
    <div id="video"></div>
    <div id="video-label"></div>
    <div id="guide60"></div>
    <div id="guide60-label">60% · y=361</div>
    <div id="boxes"></div>
    <div id="lines">
      <svg id="lines-svg" width="773" height="601" viewBox="0 0 773 601"></svg>
    </div>
    <div id="bar">
      <div id="readout"></div>
      <button type="button" id="btn-undo">Undo</button>
      <button type="button" id="btn-clear">Clear</button>
      <button type="button" id="btn-snap" class="on">Snap</button>
      <button type="button" id="btn-video">Video</button>
      <button type="button" id="btn-mode">Box</button>
      <button type="button" id="btn-export">Export</button>
      <button type="button" id="btn-hide">Hide</button>
    </div>
    <button type="button" id="restore" aria-label="Show toolbar">Bar</button>
    <div id="overlay">
      <div id="panel">
        <div id="panel-title">Export</div>
        <div id="panel-status"></div>
        <textarea id="export-text" spellcheck="false"></textarea>
        <button type="button" id="btn-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const STAGE_W = 773;
      const STAGE_H = 601;
      const BAR_H = 48;
      const GRID = 10;
      const MIN_DRAG = 20;
      const HANDLE = 28;
      const DELETE = 32;
      const LINE_HIT = 10;
      const LOCK_DEG = 8;
      const STORAGE_KEY = "highland-viewport-boxes";
      const PALETTE = [
        { fill: "rgba(56, 160, 255, 0.30)", stroke: "rgb(120, 190, 255)" },
        { fill: "rgba(46, 200, 140, 0.30)", stroke: "rgb(90, 230, 170)" },
        { fill: "rgba(255, 180, 50, 0.30)", stroke: "rgb(255, 205, 90)" },
        { fill: "rgba(200, 120, 255, 0.30)", stroke: "rgb(220, 170, 255)" },
        { fill: "rgba(255, 90, 100, 0.30)", stroke: "rgb(255, 140, 150)" },
        { fill: "rgba(80, 210, 230, 0.30)", stroke: "rgb(130, 230, 245)" }
      ];

      const stage = document.getElementById("stage");
      const gridCanvas = document.getElementById("grid");
      const videoEl = document.getElementById("video");
      const videoLabel = document.getElementById("video-label");
      const boxesEl = document.getElementById("boxes");
      const linesEl = document.getElementById("lines");
      const linesSvg = document.getElementById("lines-svg");
      const bar = document.getElementById("bar");
      const restoreBtn = document.getElementById("restore");
      const readout = document.getElementById("readout");
      const btnUndo = document.getElementById("btn-undo");
      const btnClear = document.getElementById("btn-clear");
      const btnSnap = document.getElementById("btn-snap");
      const btnVideo = document.getElementById("btn-video");
      const btnMode = document.getElementById("btn-mode");
      const btnExport = document.getElementById("btn-export");
      const btnHide = document.getElementById("btn-hide");
      const overlay = document.getElementById("overlay");
      const panelStatus = document.getElementById("panel-status");
      const exportText = document.getElementById("export-text");
      const btnClose = document.getElementById("btn-close");

      let boxes = [];
      let lines = [];
      let selectedId = null;
      let undoStack = [];
      let snapOn = true;
      let videoMode = 0;
      let drawMode = "box";
      let barHidden = false;
      let nextId = 1;
      let drag = null;

      function snapV(v) {
        return snapOn ? Math.round(v / GRID) * GRID : Math.round(v);
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function colorIndex() {
        return (boxes.length + lines.length) % PALETTE.length;
      }

      function exportBoxes() {
        return boxes.map(function (b) {
          return { x: b.x, y: b.y, w: b.w, h: b.h };
        });
      }

      function lineLength(l) {
        return Math.round(Math.hypot(l.x2 - l.x1, l.y2 - l.y1));
      }

      function exportLines() {
        return lines.map(function (l) {
          return { x1: l.x1, y1: l.y1, x2: l.x2, y2: l.y2, len: lineLength(l) };
        });
      }

      function exportPayload() {
        return { boxes: exportBoxes(), lines: exportLines() };
      }

      function formatList(arr, keys) {
        if (!arr.length) return "[]";
        return "[\n" + arr.map(function (item) {
          return "    { " + keys.map(function (k) {
            return '"' + k + '": ' + item[k];
          }).join(", ") + " }";
        }).join(",\n") + "\n  ]";
      }

      function formatExport(data) {
        return "{\n  \"boxes\": " + formatList(data.boxes, ["x", "y", "w", "h"]) +
          ",\n  \"lines\": " + formatList(data.lines, ["x1", "y1", "x2", "y2", "len"]) + "\n}";
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            boxes: exportBoxes(),
            lines: exportLines(),
            hidden: barHidden
          }));
        } catch (e) {}
      }

      function mapBoxes(arr) {
        return (arr || []).map(function (b, i) {
          return {
            id: nextId++,
            x: Number(b.x) || 0,
            y: Number(b.y) || 0,
            w: Number(b.w) || 0,
            h: Number(b.h) || 0,
            color: (b.color != null ? b.color : i) % PALETTE.length
          };
        }).filter(function (b) { return b.w >= 1 && b.h >= 1; });
      }

      function mapLines(arr) {
        return (arr || []).map(function (l, i) {
          return {
            id: nextId++,
            x1: Number(l.x1) || 0,
            y1: Number(l.y1) || 0,
            x2: Number(l.x2) || 0,
            y2: Number(l.y2) || 0,
            color: (l.color != null ? l.color : i) % PALETTE.length
          };
        }).filter(function (l) { return lineLength(l) >= 1; });
      }

      function loadStored() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (Array.isArray(data)) {
            boxes = mapBoxes(data);
            lines = [];
            return;
          }
          if (data && typeof data === "object") {
            boxes = mapBoxes(data.boxes || []);
            lines = mapLines(data.lines || []);
            if (typeof data.hidden === "boolean") barHidden = data.hidden;
          }
        } catch (e) {}
      }

      function snapshot() {
        return JSON.stringify({ boxes: boxes, lines: lines });
      }

      function pushUndo() {
        undoStack.push(snapshot());
        if (undoStack.length > 80) undoStack.shift();
      }

      function restoreSnap(raw) {
        const data = JSON.parse(raw);
        boxes = data.boxes || [];
        lines = data.lines || [];
        selectedId = null;
        renderAll();
        persist();
      }

      function updateReadout() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        const pw = Math.round(w * dpr);
        const ph = Math.round(h * dpr);
        const ok = (w === STAGE_W && h === STAGE_H);
        readout.className = ok ? "" : "mismatch";
        readout.innerHTML =
          '<span class="num">' + w + " × " + h + "</span>" +
          "  ·  dpr " + dpr.toFixed(2) +
          "  ·  <span class=\"num\">" + pw + " × " + ph + "</span>";
      }

      function drawGrid() {
        const dpr = window.devicePixelRatio || 1;
        gridCanvas.width = Math.round(STAGE_W * dpr);
        gridCanvas.height = Math.round(STAGE_H * dpr);
        gridCanvas.style.width = STAGE_W + "px";
        gridCanvas.style.height = STAGE_H + "px";
        const ctx = gridCanvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, STAGE_W, STAGE_H);

        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= STAGE_W; x += GRID) {
          if (x % 50 === 0) continue;
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, STAGE_H);
        }
        for (let y = 0; y <= STAGE_H; y += GRID) {
          if (y % 50 === 0) continue;
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(STAGE_W, y + 0.5);
        }
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.beginPath();
        for (let x = 0; x <= STAGE_W; x += 50) {
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, STAGE_H);
        }
        for (let y = 0; y <= STAGE_H; y += 50) {
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(STAGE_W, y + 0.5);
        }
        ctx.stroke();

        ctx.font = "500 10px Inter, sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const tickTop = barHidden ? 3 : BAR_H + 3;
        for (let x = 50; x < STAGE_W; x += 50) {
          const ty = (barHidden && x >= 720) ? 48 : tickTop;
          ctx.fillText(String(x), x, ty);
        }
        ctx.textAlign = "left";
        const yStart = barHidden ? 0 : 50;
        for (let y = yStart; y < STAGE_H; y += 50) {
          if (y <= tickTop + 12) {
            ctx.textBaseline = "top";
            ctx.fillText(String(y), 4, tickTop + 13);
          } else if (y + 8 > STAGE_H) {
            ctx.textBaseline = "bottom";
            ctx.fillText(String(y), 4, y - 2);
          } else {
            ctx.textBaseline = "middle";
            ctx.fillText(String(y), 4, y);
          }
        }
      }

      function applyBar() {
        bar.style.display = barHidden ? "none" : "block";
        restoreBtn.style.display = barHidden ? "block" : "none";
        drawGrid();
        applyVideoMode();
      }

      function applyVideoMode() {
        if (videoMode === 0) {
          videoEl.style.display = "none";
          videoLabel.style.display = "none";
          btnVideo.className = "";
          btnVideo.textContent = "Video";
          return;
        }
        btnVideo.className = "on";
        videoEl.style.display = "block";
        videoLabel.style.display = "block";
        const topPad = barHidden ? 0 : BAR_H;
        if (videoMode === 1) {
          btnVideo.textContent = "16:9";
          videoEl.style.left = "0px";
          videoEl.style.top = "0px";
          videoEl.style.width = "773px";
          videoEl.style.height = "435px";
          videoLabel.style.left = "0px";
          videoLabel.style.width = "773px";
          videoLabel.style.top = Math.round(topPad + (435 - topPad - 20) / 2) + "px";
          videoLabel.textContent = "773 × 435  ·  16:9";
        } else {
          btnVideo.textContent = "60%";
          videoEl.style.left = "66px";
          videoEl.style.top = "0px";
          videoEl.style.width = "641px";
          videoEl.style.height = "361px";
          videoLabel.style.left = "66px";
          videoLabel.style.width = "641px";
          videoLabel.style.top = Math.round(topPad + (361 - topPad - 20) / 2) + "px";
          videoLabel.textContent = "641 × 361  ·  fit 60%";
        }
      }

      function applyModeBtn() {
        btnMode.textContent = drawMode === "line" ? "Line" : "Box";
        btnMode.className = drawMode === "line" ? "on" : "";
      }

      function deleteClass(box) {
        const nearTop = box.y < (barHidden ? 10 : BAR_H + 10);
        const nearRight = box.x + box.w > STAGE_W - 22;
        const cls = [];
        if (nearTop) cls.push("delete-inside");
        if (nearRight) cls.push("delete-flip");
        return cls.join(" ");
      }

      function lineLabelText(l) {
        const dx = l.x2 - l.x1;
        const dy = l.y2 - l.y1;
        return lineLength(l) + "px · " + dx + "," + dy;
      }

      function axisLock(x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (dx === 0 && dy === 0) return { x: x2, y: y2 };
        const ang = Math.abs(Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI);
        if (ang <= LOCK_DEG) return { x: x2, y: y1 };
        if (ang >= 90 - LOCK_DEG) return { x: x1, y: y2 };
        return { x: x2, y: y2 };
      }

      function lockedEnd(x1, y1, x, y) {
        const s = axisLock(x1, y1, snapV(x), snapV(y));
        return { x: clamp(s.x, 0, STAGE_W), y: clamp(s.y, 0, STAGE_H) };
      }

      function distToSegment(px, py, x1, y1, x2, y2) {
        const vx = x2 - x1, vy = y2 - y1;
        const len2 = vx * vx + vy * vy;
        if (len2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * vx + (py - y1) * vy) / len2;
        t = clamp(t, 0, 1);
        return Math.hypot(px - (x1 + t * vx), py - (y1 + t * vy));
      }

      function labelAnchor(l) {
        const mx = (l.x1 + l.x2) / 2;
        const my = (l.y1 + l.y2) / 2;
        const dx = l.x2 - l.x1;
        const dy = l.y2 - l.y1;
        const len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len, ny = dx / len;
        if (ny > 0) { nx = -nx; ny = -ny; }
        return { x: mx + nx * 18, y: my + ny * 18, nx: nx, ny: ny, mx: mx, my: my };
      }

      function placeLineChrome(l) {
        const label = linesEl.querySelector('.line-label[data-id="' + l.id + '"]');
        const ep1 = linesEl.querySelector('.line-ep[data-id="' + l.id + '"][data-role="ep1"]');
        const ep2 = linesEl.querySelector('.line-ep[data-id="' + l.id + '"][data-role="ep2"]');
        const del = linesEl.querySelector('.line-delete[data-id="' + l.id + '"]');
        const svgLine = linesSvg.querySelector('line[data-id="' + l.id + '"][data-role="stroke"]');
        const svgGlow = linesSvg.querySelector('line[data-id="' + l.id + '"][data-role="glow"]');
        if (svgLine) {
          svgLine.setAttribute("x1", l.x1);
          svgLine.setAttribute("y1", l.y1);
          svgLine.setAttribute("x2", l.x2);
          svgLine.setAttribute("y2", l.y2);
        }
        if (svgGlow) {
          svgGlow.setAttribute("x1", l.x1);
          svgGlow.setAttribute("y1", l.y1);
          svgGlow.setAttribute("x2", l.x2);
          svgGlow.setAttribute("y2", l.y2);
        }
        if (label) {
          label.textContent = lineLabelText(l);
          const a = labelAnchor(l);
          let lx = a.x;
          let ly = a.y;
          const lw = label.offsetWidth || 120;
          const lh = label.offsetHeight || 24;
          lx = clamp(Math.round(lx - lw / 2), 4, STAGE_W - lw - 4);
          ly = clamp(Math.round(ly - lh / 2), 4, STAGE_H - lh - 4);
          label.style.left = lx + "px";
          label.style.top = ly + "px";
          if (del) {
            let dx = a.mx + a.nx * 36 - DELETE / 2;
            let dy = a.my + a.ny * 36 - DELETE / 2;
            if (label && Math.abs((dx + 16) - (lx + lw / 2)) < lw / 2 + 16 && Math.abs((dy + 16) - (ly + 12)) < 28) {
              dx = a.mx - a.nx * 28 - DELETE / 2;
              dy = a.my - a.ny * 28 - DELETE / 2;
            }
            dx = clamp(Math.round(dx), 2, STAGE_W - DELETE - 2);
            dy = clamp(Math.round(dy), 2, STAGE_H - DELETE - 2);
            del.style.left = dx + "px";
            del.style.top = dy + "px";
          }
        }
        if (ep1) { ep1.style.left = (l.x1 - 14) + "px"; ep1.style.top = (l.y1 - 14) + "px"; }
        if (ep2) { ep2.style.left = (l.x2 - 14) + "px"; ep2.style.top = (l.y2 - 14) + "px"; }
      }

      function renderBoxes() {
        boxesEl.innerHTML = "";
        boxes.forEach(function (box) {
          const pal = PALETTE[box.color % PALETTE.length];
          const el = document.createElement("div");
          const isSel = box.id === selectedId;
          el.className = "box" + (isSel ? " selected" : "") + (isSel && deleteClass(box) ? " " + deleteClass(box) : "");
          el.dataset.id = String(box.id);
          el.style.left = box.x + "px";
          el.style.top = box.y + "px";
          el.style.width = box.w + "px";
          el.style.height = box.h + "px";
          el.style.background = pal.fill;
          el.style.borderColor = pal.stroke;
          el.innerHTML =
            '<div class="box-xy">' + box.x + "," + box.y + "</div>" +
            '<div class="box-size">' + box.w + " × " + box.h + "</div>" +
            '<div class="box-handle" data-role="handle"></div>' +
            '<button type="button" class="box-delete" data-role="delete" aria-label="Delete">✕</button>';
          boxesEl.appendChild(el);
        });
      }

      function renderLines() {
        const keepSvg = linesSvg;
        linesEl.innerHTML = "";
        linesEl.appendChild(keepSvg);
        keepSvg.innerHTML = "";
        lines.forEach(function (l) {
          const pal = PALETTE[l.color % PALETTE.length];
          const isSel = l.id === selectedId;
          const glow = document.createElementNS("http://www.w3.org/2000/svg", "line");
          glow.setAttribute("data-id", String(l.id));
          glow.setAttribute("data-role", "glow");
          glow.setAttribute("x1", l.x1);
          glow.setAttribute("y1", l.y1);
          glow.setAttribute("x2", l.x2);
          glow.setAttribute("y2", l.y2);
          glow.setAttribute("stroke", isSel ? "rgba(255,255,255,0.55)" : "transparent");
          glow.setAttribute("stroke-width", "8");
          glow.setAttribute("stroke-linecap", "round");
          const stroke = document.createElementNS("http://www.w3.org/2000/svg", "line");
          stroke.setAttribute("data-id", String(l.id));
          stroke.setAttribute("data-role", "stroke");
          stroke.setAttribute("x1", l.x1);
          stroke.setAttribute("y1", l.y1);
          stroke.setAttribute("x2", l.x2);
          stroke.setAttribute("y2", l.y2);
          stroke.setAttribute("stroke", pal.stroke);
          stroke.setAttribute("stroke-width", isSel ? "4" : "3");
          stroke.setAttribute("stroke-linecap", "round");
          keepSvg.appendChild(glow);
          keepSvg.appendChild(stroke);

          const label = document.createElement("div");
          label.className = "line-label";
          label.dataset.id = String(l.id);
          label.textContent = lineLabelText(l);
          linesEl.appendChild(label);

          const ep1 = document.createElement("div");
          ep1.className = "line-ep" + (isSel ? " visible" : "");
          ep1.dataset.id = String(l.id);
          ep1.dataset.role = "ep1";
          const ep2 = document.createElement("div");
          ep2.className = "line-ep" + (isSel ? " visible" : "");
          ep2.dataset.id = String(l.id);
          ep2.dataset.role = "ep2";
          linesEl.appendChild(ep1);
          linesEl.appendChild(ep2);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "line-delete" + (isSel ? " visible" : "");
          del.dataset.id = String(l.id);
          del.dataset.role = "delete";
          del.setAttribute("aria-label", "Delete");
          del.textContent = "✕";
          linesEl.appendChild(del);
        });
        lines.forEach(placeLineChrome);
      }

      function renderAll() {
        renderBoxes();
        renderLines();
      }

      function updateBoxEl(box) {
        const el = boxesEl.querySelector('[data-id="' + box.id + '"]');
        if (!el) return;
        el.style.left = box.x + "px";
        el.style.top = box.y + "px";
        el.style.width = box.w + "px";
        el.style.height = box.h + "px";
        const xy = el.querySelector(".box-xy");
        const size = el.querySelector(".box-size");
        if (xy) xy.textContent = box.x + "," + box.y;
        if (size) size.textContent = box.w + " × " + box.h;
        if (box.id === selectedId) {
          const extra = deleteClass(box);
          el.className = "box selected" + (extra ? " " + extra : "");
        }
      }

      function findBox(id) {
        return boxes.find(function (b) { return b.id === id; });
      }

      function findLine(id) {
        return lines.find(function (l) { return l.id === id; });
      }

      function pointFromEvent(e) {
        const r = stage.getBoundingClientRect();
        return {
          x: clamp(e.clientX - r.left, 0, STAGE_W),
          y: clamp(e.clientY - r.top, 0, STAGE_H)
        };
      }

      function hitBoxAt(x, y) {
        for (let i = boxes.length - 1; i >= 0; i--) {
          const b = boxes[i];
          if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
        }
        return null;
      }

      function hitLineAt(x, y) {
        for (let i = lines.length - 1; i >= 0; i--) {
          const l = lines[i];
          if (distToSegment(x, y, l.x1, l.y1, l.x2, l.y2) <= LINE_HIT) return l;
        }
        return null;
      }

      function isInDelete(box, x, y) {
        const nearTop = box.y < (barHidden ? 10 : BAR_H + 10);
        const nearRight = box.x + box.w > STAGE_W - 22;
        let dx = nearRight ? (nearTop ? box.x + 4 : box.x - 10) : (nearTop ? box.x + box.w - 4 - DELETE : box.x + box.w - DELETE + 10);
        let dy = nearTop ? box.y + 4 : box.y - 10;
        return x >= dx && x <= dx + DELETE && y >= dy && y <= dy + DELETE;
      }

      function isInHandle(box, x, y) {
        return x >= box.x + box.w - HANDLE && x <= box.x + box.w &&
               y >= box.y + box.h - HANDLE && y <= box.y + box.h;
      }

      function isInLineEp(l, which, x, y) {
        const ex = which === 1 ? l.x1 : l.x2;
        const ey = which === 1 ? l.y1 : l.y2;
        return x >= ex - 14 && x <= ex + 14 && y >= ey - 14 && y <= ey + 14;
      }

      function isInLineDelete(x, y, el) {
        if (!el || !el.classList.contains("visible")) return false;
        const r = el.getBoundingClientRect();
        const s = stage.getBoundingClientRect();
        const left = r.left - s.left, top = r.top - s.top;
        return x >= left && x <= left + r.width && y >= top && y <= top + r.height;
      }

      function onPointerDown(e) {
        if (overlay.style.display === "block") return;
        const t = e.target;
        if (t.closest && (t.closest("#bar") || t.closest("#overlay") || t.closest("#restore"))) return;
        e.preventDefault();
        stage.setPointerCapture(e.pointerId);
        const p = pointFromEvent(e);

        const selBox = findBox(selectedId);
        const selLine = findLine(selectedId);

        if (selLine) {
          const del = linesEl.querySelector('.line-delete[data-id="' + selLine.id + '"]');
          if (t.getAttribute("data-role") === "delete" && Number((t.closest && t.closest("[data-id]") || t).dataset.id) === selLine.id || isInLineDelete(p.x, p.y, del)) {
            if (t.getAttribute("data-role") === "delete" && t.classList.contains("line-delete") || isInLineDelete(p.x, p.y, del)) {
              pushUndo();
              lines = lines.filter(function (l) { return l.id !== selLine.id; });
              selectedId = null;
              renderAll();
              persist();
              drag = null;
              return;
            }
          }
          if (t.getAttribute("data-role") === "ep1" || isInLineEp(selLine, 1, p.x, p.y)) {
            pushUndo();
            drag = { type: "line-ep", id: selLine.id, which: 1, moved: false };
            return;
          }
          if (t.getAttribute("data-role") === "ep2" || isInLineEp(selLine, 2, p.x, p.y)) {
            pushUndo();
            drag = { type: "line-ep", id: selLine.id, which: 2, moved: false };
            return;
          }
        }

        if (selBox && (t.getAttribute("data-role") === "delete" || isInDelete(selBox, p.x, p.y))) {
          if (!t.classList || !t.classList.contains("line-delete")) {
            pushUndo();
            boxes = boxes.filter(function (b) { return b.id !== selBox.id; });
            selectedId = null;
            renderAll();
            persist();
            drag = null;
            return;
          }
        }
        if (selBox && (t.getAttribute("data-role") === "handle" || isInHandle(selBox, p.x, p.y))) {
          pushUndo();
          drag = {
            type: "resize",
            id: selBox.id,
            startX: p.x,
            startY: p.y,
            orig: { x: selBox.x, y: selBox.y, w: selBox.w, h: selBox.h },
            moved: false
          };
          return;
        }

        const hitL = (t.closest && t.closest(".line-label, .line-ep, .line-delete"))
          ? findLine(Number((t.closest("[data-id]") || {}).dataset.id))
          : hitLineAt(p.x, p.y);
        if (hitL) {
          selectedId = hitL.id;
          renderAll();
          pushUndo();
          drag = {
            type: "line-move",
            id: hitL.id,
            startX: p.x,
            startY: p.y,
            orig: { x1: hitL.x1, y1: hitL.y1, x2: hitL.x2, y2: hitL.y2 },
            moved: false
          };
          return;
        }

        const hit = (t.closest && t.closest(".box"))
          ? findBox(Number(t.closest(".box").dataset.id))
          : hitBoxAt(p.x, p.y);
        if (hit) {
          selectedId = hit.id;
          renderAll();
          pushUndo();
          drag = {
            type: "move",
            id: hit.id,
            offsetX: p.x - hit.x,
            offsetY: p.y - hit.y,
            orig: { x: hit.x, y: hit.y, w: hit.w, h: hit.h },
            moved: false
          };
          return;
        }

        if (!barHidden && p.y < BAR_H) return;
        selectedId = null;
        renderAll();
        drag = {
          type: drawMode === "line" ? "draw-line" : "draw-box",
          startX: snapV(p.x),
          startY: snapV(p.y),
          id: null
        };
      }

      function onPointerMove(e) {
        if (!drag) return;
        e.preventDefault();
        const p = pointFromEvent(e);
        if (drag.type === "draw-box") {
          const x1 = drag.startX, y1 = drag.startY;
          const x2 = snapV(p.x), y2 = snapV(p.y);
          const x = Math.min(x1, x2);
          const y = Math.min(y1, y2);
          const w = Math.abs(x2 - x1);
          const h = Math.abs(y2 - y1);
          if (!drag.id) {
            const box = { id: nextId++, x: x, y: y, w: w, h: h, color: colorIndex(), preview: true };
            drag.id = box.id;
            selectedId = box.id;
            boxes.push(box);
            renderAll();
          } else {
            const box = findBox(drag.id);
            if (!box) return;
            box.x = x; box.y = y; box.w = w; box.h = h;
            updateBoxEl(box);
          }
          return;
        }
        if (drag.type === "draw-line") {
          const end = lockedEnd(drag.startX, drag.startY, p.x, p.y);
          if (!drag.id) {
            const line = {
              id: nextId++,
              x1: drag.startX, y1: drag.startY,
              x2: end.x, y2: end.y,
              color: colorIndex(),
              preview: true
            };
            drag.id = line.id;
            selectedId = line.id;
            lines.push(line);
            renderAll();
          } else {
            const line = findLine(drag.id);
            if (!line) return;
            line.x2 = end.x;
            line.y2 = end.y;
            placeLineChrome(line);
          }
          return;
        }
        if (drag.type === "line-ep") {
          const line = findLine(drag.id);
          if (!line) return;
          if (drag.which === 1) {
            const end = lockedEnd(line.x2, line.y2, p.x, p.y);
            if (end.x !== line.x1 || end.y !== line.y1) drag.moved = true;
            line.x1 = end.x;
            line.y1 = end.y;
          } else {
            const end = lockedEnd(line.x1, line.y1, p.x, p.y);
            if (end.x !== line.x2 || end.y !== line.y2) drag.moved = true;
            line.x2 = end.x;
            line.y2 = end.y;
          }
          placeLineChrome(line);
          return;
        }
        if (drag.type === "line-move") {
          const line = findLine(drag.id);
          if (!line) return;
          let dx = snapV(drag.orig.x1 + (p.x - drag.startX)) - drag.orig.x1;
          let dy = snapV(drag.orig.y1 + (p.y - drag.startY)) - drag.orig.y1;
          let x1 = drag.orig.x1 + dx, y1 = drag.orig.y1 + dy;
          let x2 = drag.orig.x2 + dx, y2 = drag.orig.y2 + dy;
          const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
          const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
          if (minX < 0) { x1 -= minX; x2 -= minX; }
          if (minY < 0) { y1 -= minY; y2 -= minY; }
          if (maxX > STAGE_W) { x1 -= (maxX - STAGE_W); x2 -= (maxX - STAGE_W); }
          if (maxY > STAGE_H) { y1 -= (maxY - STAGE_H); y2 -= (maxY - STAGE_H); }
          if (x1 !== line.x1 || y1 !== line.y1 || x2 !== line.x2 || y2 !== line.y2) drag.moved = true;
          line.x1 = x1; line.y1 = y1; line.x2 = x2; line.y2 = y2;
          placeLineChrome(line);
          return;
        }
        const box = findBox(drag.id);
        if (!box) return;
        if (drag.type === "move") {
          let nx = snapV(p.x - drag.offsetX);
          let ny = snapV(p.y - drag.offsetY);
          nx = clamp(nx, 0, STAGE_W - box.w);
          ny = clamp(ny, 0, STAGE_H - box.h);
          if (nx !== box.x || ny !== box.y) drag.moved = true;
          box.x = nx;
          box.y = ny;
          updateBoxEl(box);
        } else if (drag.type === "resize") {
          let rw = snapV(drag.orig.w + (p.x - drag.startX));
          let rh = snapV(drag.orig.h + (p.y - drag.startY));
          rw = clamp(rw, MIN_DRAG, STAGE_W - box.x);
          rh = clamp(rh, MIN_DRAG, STAGE_H - box.y);
          if (rw !== box.w || rh !== box.h) drag.moved = true;
          box.w = rw;
          box.h = rh;
          updateBoxEl(box);
        }
      }

      function onPointerUp(e) {
        if (!drag) return;
        if (e) e.preventDefault();
        if (drag.type === "draw-box") {
          const box = findBox(drag.id);
          if (!box || box.w < MIN_DRAG || box.h < MIN_DRAG) {
            if (box) boxes = boxes.filter(function (b) { return b.id !== box.id; });
            selectedId = null;
            renderAll();
          } else {
            delete box.preview;
            const without = { boxes: boxes.filter(function (b) { return b.id !== box.id; }), lines: lines };
            undoStack.push(JSON.stringify(without));
            if (undoStack.length > 80) undoStack.shift();
            selectedId = box.id;
            renderAll();
            persist();
          }
        } else if (drag.type === "draw-line") {
          const line = findLine(drag.id);
          if (!line || lineLength(line) < MIN_DRAG) {
            if (line) lines = lines.filter(function (l) { return l.id !== line.id; });
            selectedId = null;
            renderAll();
          } else {
            delete line.preview;
            const without = { boxes: boxes, lines: lines.filter(function (l) { return l.id !== line.id; }) };
            undoStack.push(JSON.stringify(without));
            if (undoStack.length > 80) undoStack.shift();
            selectedId = line.id;
            renderAll();
            persist();
          }
        } else {
          if (!drag.moved) {
            undoStack.pop();
          } else {
            persist();
          }
          renderAll();
        }
        drag = null;
      }

      function undo() {
        if (!undoStack.length) return;
        restoreSnap(undoStack.pop());
      }

      function clearAll() {
        if (!boxes.length && !lines.length) return;
        pushUndo();
        boxes = [];
        lines = [];
        selectedId = null;
        renderAll();
        persist();
      }

      function cycleVideo() {
        videoMode = (videoMode + 1) % 3;
        applyVideoMode();
      }

      function toggleSnap() {
        snapOn = !snapOn;
        btnSnap.className = snapOn ? "on" : "";
      }

      function toggleMode() {
        drawMode = drawMode === "box" ? "line" : "box";
        applyModeBtn();
      }

      function setBarHidden(hidden) {
        barHidden = !!hidden;
        applyBar();
        persist();
      }

      function showExport(copied) {
        const json = formatExport(exportPayload());
        exportText.value = json;
        panelStatus.textContent = copied
          ? "Copied to clipboard"
          : "Clipboard unavailable — copy from here";
        panelStatus.className = copied ? "" : "fail";
        overlay.style.display = "block";
      }

      function doExport() {
        const json = formatExport(exportPayload());
        exportText.value = json;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(json).then(function () {
            showExport(true);
          }).catch(function () {
            showExport(false);
          });
        } else {
          showExport(false);
        }
      }

      stage.addEventListener("pointerdown", onPointerDown);
      stage.addEventListener("pointermove", onPointerMove);
      stage.addEventListener("pointerup", onPointerUp);
      stage.addEventListener("pointercancel", onPointerUp);
      stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      btnUndo.addEventListener("click", function (e) { e.stopPropagation(); undo(); });
      btnClear.addEventListener("click", function (e) { e.stopPropagation(); clearAll(); });
      btnSnap.addEventListener("click", function (e) { e.stopPropagation(); toggleSnap(); });
      btnVideo.addEventListener("click", function (e) { e.stopPropagation(); cycleVideo(); });
      btnMode.addEventListener("click", function (e) { e.stopPropagation(); toggleMode(); });
      btnExport.addEventListener("click", function (e) { e.stopPropagation(); doExport(); });
      btnHide.addEventListener("click", function (e) { e.stopPropagation(); setBarHidden(true); });
      restoreBtn.addEventListener("click", function (e) { e.stopPropagation(); setBarHidden(false); });
      btnClose.addEventListener("click", function (e) {
        e.stopPropagation();
        overlay.style.display = "none";
      });
      overlay.addEventListener("pointerdown", function (e) {
        if (e.target === overlay) overlay.style.display = "none";
      });

      window.addEventListener("resize", function () {
        updateReadout();
        drawGrid();
      });

      loadStored();
      updateReadout();
      applyModeBtn();
      applyBar();
      renderAll();

      window.__viewportMeasure = {
        getBoxes: function () { return exportBoxes(); },
        getLines: function () { return exportLines(); },
        setBoxes: function (arr) {
          boxes = mapBoxes(arr);
          selectedId = null;
          renderAll();
          persist();
        },
        setLines: function (arr) {
          lines = mapLines(arr);
          selectedId = null;
          renderAll();
          persist();
        },
        setVideo: function (mode) { videoMode = mode; applyVideoMode(); },
        setSelected: function (kind, index) {
          const list = kind === "line" ? lines : boxes;
          selectedId = list[index] ? list[index].id : null;
          renderAll();
        },
        setSnap: function (on) { snapOn = !!on; btnSnap.className = snapOn ? "on" : ""; },
        setMode: function (mode) { drawMode = mode === "line" ? "line" : "box"; applyModeBtn(); },
        setBarHidden: setBarHidden,
        showExport: doExport,
        getState: function () {
          return {
            boxes: exportBoxes(),
            lines: exportLines(),
            snapOn: snapOn,
            videoMode: videoMode,
            selectedId: selectedId,
            drawMode: drawMode,
            barHidden: barHidden
          };
        }
      };
    })();
  </script>
